services:
  mirror-v-server:
    build: ./mirror-v-server
    container_name: mirror-v-server
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - postgres
      - kafka

  mirror-v-ai-worker:
    build: ./mirror-v-ai-worker
    container_name: mirror-v-ai-worker
    environment:
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    depends_on:
      - kafka

  mirror-v-web:
    build: ./mirror-v-web
    container_name: mirror-v-web
    ports:
      - "3000:3000"

  postgres:
    image: postgres:15-alpine
    container_name: mirror-v-db
    environment:
      POSTGRES_DB: mirror_v
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - ./init_sql:/docker-entrypoint-initdb.d
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: bitnami/kafka:3.5
    container_name: mirror-v-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER

  nginx:
    image: nginx:alpine
    container_name: mirror-v-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./storage:/usr/share/nginx/html/storage:ro
    depends_on:
      - mirror-v-web
      - mirror-v-server

volumes:
  postgres_data:
